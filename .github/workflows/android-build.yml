name: MULTIWORK Android Build

on:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.11
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11/bin" >> "$GITHUB_PATH"

      - name: Build Android debug APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
